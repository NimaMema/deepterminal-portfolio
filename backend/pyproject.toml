[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepterminal-api"
version = "0.3.0"
description = "DEEPTERMINAL research API (FastAPI + PostgreSQL) on top of the deepterminal calculation core."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "jinja2>=3.1",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70", "openai>=1.50"]
pdf = ["playwright>=1.45"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["deepterminal_api*"]

[tool.setuptools.package-data]
"deepterminal_api" = ["**/*.html", "**/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
