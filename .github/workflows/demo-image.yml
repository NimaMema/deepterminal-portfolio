# Build the public-demo image and test it in a signed-out browser, entirely inside CI.
# Publishes nothing; it verifies the exact image the deploy workflow ships.
name: Demo image

on:
  push:
    paths: ["deploy/**", "backend/deepterminal_api/**", "frontend/**", "deepterminal/**", ".github/workflows/demo-image.yml", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and build
        run: |
          deploy/assemble.sh space
          docker build -t deepterminal-demo space
      - name: Verify local API image PDF as its unprivileged user
        run: |
          docker build -t deepterminal-api -f backend/Dockerfile .
          docker run --rm --entrypoint python deepterminal-api -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(args=["--no-sandbox"]); page = b.new_page(); page.set_content("<h1>Private release PDF check</h1>"); assert page.pdf().startswith(b"%PDF"); b.close(); p.stop()'
      - name: Run like the Space (uid 1000, port 7860, no outbound network needed)
        run: |
          docker run -d --name demo -p 7860:7860 deepterminal-demo
          start=$(date +%s)
          for i in $(seq 1 150); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/api/health || true)
            [ "$code" = "200" ] && break; sleep 2
          done
          echo "healthy after $(( $(date +%s) - start ))s (last code $code)"
          if [ "$code" != "200" ]; then
            echo "--- diagnostics from inside the container"
            docker exec demo python - <<'PY' || true
          import time, urllib.request
          for url in ("http://127.0.0.1:8000/api/health", "http://127.0.0.1:7860/api/health", "http://127.0.0.1:7860/"):
              t = time.time()
              try:
                  r = urllib.request.urlopen(url, timeout=15); print(url, r.status, f"{time.time() - t:.1f}s")
              except Exception as e:
                  print(url, "ERROR", repr(e), f"{time.time() - t:.1f}s")
          PY
            echo "--- from the host"; curl -sv -m 15 http://127.0.0.1:7860/api/health 2>&1 | tail -20 || true
            docker ps -a; docker logs demo 2>&1 | tail -40; exit 1
          fi
          curl -sf -m 30 http://127.0.0.1:7860/api/status | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['public_demo'] and not d['paid_apis_enabled'];print('status ok')"
          # Wait for the start-up warm-up (every screen computed once), as visitors would find it.
          for i in $(seq 1 120); do
            curl -s -m 10 http://127.0.0.1:7860/api/status | grep -q '"warm":true' && { docker logs demo 2>&1 | grep "warm:" | tail -3; break; }
            sleep 10
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test in a fresh, signed-out browser
        working-directory: deploy/smoke
        run: |
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node smoke.mjs http://127.0.0.1:7860
      - name: Container log
        if: always()
        run: docker logs demo 2>&1 | tail -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-image-screenshots
          path: deploy/smoke/out
